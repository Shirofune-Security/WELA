name: Native ephemeral CAPI2 key probe
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capi2-key-probe:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        engine: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Native event70 feasibility in Windows PowerShell 5.1
        if: matrix.engine == 'powershell'
        shell: powershell
        run: ./tests/Capi2KeyProbe.Checkpoint.Windows.Tests.ps1 -AllowDisposableChannelWrite
      - name: Native event70 feasibility in PowerShell 7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: ./tests/Capi2KeyProbe.Checkpoint.Windows.Tests.ps1 -AllowDisposableChannelWrite
      - name: Retain native XML, generated public certificates and cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: capi2-key-probe-${{ matrix.os }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/wela-capi2-key-checkpoint-*/
          retention-days: 7
